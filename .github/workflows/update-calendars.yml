name: Update Calendars

on:
  schedule:
    - cron: '0 6,18 * * *'  # 6AM and 6PM UTC
  workflow_dispatch:         # manual trigger from GitHub UI
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest -v

      - name: Generate ICS files
        run: python main.py

      - name: Prepare publish directory
        id: publish
        run: |
          shopt -s nullglob
          calendars=(ics/*.ics)
          if (( ${#calendars[@]} == 0 )); then
            echo "::warning::No calendars generated; preserving the existing GitHub Pages deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p public/ics
          cp index.html public/
          cp "${calendars[@]}" public/ics/
          cp ics/teams.json public/ics/
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        if: steps.publish.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
